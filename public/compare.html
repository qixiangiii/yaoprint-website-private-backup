<script src="/js/main.js"></script>
<script>
fetch('/api/products').then(r => r.json()).then(list => {
  const keys = ['技术', '尺寸', '精度', '速度'];
  const thead = '<tr><th>参数</th>' + list.map(p => `<th>${p.name}</th>`).join('') + '</tr>';
  let body = '';
  keys.forEach(k => {
    body += '<tr><td>' + k + '</td>' + list.map(p => {
      let spec = {}; try { spec = JSON.parse(p.spec_json || '{}'); } catch {}
      return `<td>${spec[k] || '-'}</td>`;
    }).join('') + '</tr>';
  });
  body += '<tr><td>参考价</td>' + list.map(p => `<td>${p.price || '-'}</td>`).join('') + '</tr>';
  document.getElementById('compareTable').innerHTML = `<thead>${thead}</thead><tbody>${body}</tbody>`;
});
</script>
